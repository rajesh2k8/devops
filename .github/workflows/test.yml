name: PHP Command Example

on: [push]

jobs:
  run-php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run inline PHP command
        run: php -r "echo 'Hello from PHP!';"
